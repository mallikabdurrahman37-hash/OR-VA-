<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Details — ORÈVA</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="section-tight">
    <div class="container" style="max-width:760px">
      <a href="my-orders.html" class="small" style="text-decoration:underline">&larr; My Orders</a>
      <div id="od-loading" class="text-center mt-3"><p class="small">Loading order…</p></div>
      <div id="od-content" hidden></div>
      <div id="od-notfound" class="empty-state" hidden>
        <p class="h4">Order not found</p>
        <a href="my-orders.html" class="btn btn-primary mt-3">Back to Orders</a>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<style>
  .timeline{ display:flex; flex-direction:column; margin-top:1.2rem; }
  .t-step{ display:flex; gap:0.9rem; }
  .t-dot-col{ display:flex; flex-direction:column; align-items:center; }
  .t-dot{ width:14px; height:14px; border-radius:50%; background:var(--line); flex-shrink:0; margin-top:2px; }
  .t-step.done .t-dot{ background:var(--moss); }
  .t-line{ width:2px; flex:1; background:var(--line); min-height:26px; }
  .t-step.done .t-line{ background:var(--moss); }
  .t-step:last-child .t-line{ display:none; }
  .t-label{ padding-bottom:1.3rem; }
  .t-title{ font-weight:600; font-size:0.9rem; }
  .t-step.done .t-title{ color:var(--moss-dark); }
  .od-line{ display:flex; justify-content:space-between; font-size:0.85rem; padding:0.25rem 0; }
</style>

<script type="module">
  import { renderHeader, renderFooter, applyBackground, formatDate, formatINR, toast } from './js/ui.js';
  import { fetchOrderById, STAGES, stageIndex, canCancel, requestCancellation } from './js/orders.js';
  import './js/auth.js';

  renderHeader('');
  renderFooter();
  applyBackground();

  const id = new URLSearchParams(location.search).get('id');

  async function load(){
    const order = id ? await fetchOrderById(id).catch(() => null) : null;
    document.getElementById('od-loading').hidden = true;
    if (!order) { document.getElementById('od-notfound').hidden = false; return; }
    render(order);
  }

  function render(order){
    const cancelled = order.cancelled;
    const idx = cancelled ? -1 : stageIndex(order.orderStatus);
    const a = order.shippingAddress || {};
    document.getElementById('od-content').hidden = false;
    document.getElementById('od-content').innerHTML = `
      <div class="flex justify-between items-center mt-2" style="flex-wrap:wrap;gap:0.5rem">
        <h1 class="h-display h3">${order.orderNumber || order.id}</h1>
        ${cancelled ? `<span class="badge-pill status-error">Cancelled</span>` : `<span class="badge-pill status-active">${order.orderStatus || 'Order Placed'}</span>`}
      </div>
      <p class="small mt-1">Placed ${formatDate(order.orderDate)} · Expected delivery ${formatDate(order.expectedDelivery)}</p>

      ${order.delayNote ? `<div class="card mt-2" style="background:#F3E7D6;border-color:#E4CBA0"><p class="small" style="color:#7A5A24">${order.delayNote}</p></div>` : ''}

      ${!cancelled ? `<div class="card mt-2"><div class="timeline">
        ${STAGES.map((s,i) => `
          <div class="t-step ${i<=idx?'done':''}">
            <div class="t-dot-col"><div class="t-dot"></div><div class="t-line"></div></div>
            <div class="t-label"><div class="t-title">${s}</div></div>
          </div>`).join('')}
      </div></div>` : ''}

      ${(order.courierService || order.trackingId) ? `
      <div class="card mt-2">
        <p class="small" style="font-weight:600;color:var(--ink)">Courier: ${order.courierService || '—'}</p>
        <div class="flex items-center gap-sm mt-1">
          <span class="small">Tracking ID: <strong>${order.trackingId || '—'}</strong></span>
          <button class="btn btn-ghost btn-sm" id="copy-tracking">Copy</button>
        </div>
      </div>` : ''}

      <div class="card mt-2">
        <h3 class="h4 mb-2">Items</h3>
        ${(order.items||[]).map(it => `<div class="od-line"><span>${it.name}${it.size?' ('+it.size+')':''} × ${it.qty}</span><span>${formatINR(it.price*it.qty)}</span></div>`).join('')}
        <hr class="divider">
        <div class="od-line"><span>Subtotal</span><span>${formatINR(order.subtotal)}</span></div>
        <div class="od-line"><span>Shipping</span><span>${order.shippingCharge>0?formatINR(order.shippingCharge):'Free'}</span></div>
        <div class="od-line" style="font-weight:700"><span>Total</span><span>${formatINR(order.totalAmount)}</span></div>
      </div>

      <div class="card mt-2">
        <span class="small" style="font-weight:600;color:var(--ink)">Delivering To</span>
        <p class="small mt-1">${a.name||''}, ${a.addressLine||''}, ${a.city||''}, ${a.state||''} - ${a.pincode||''} · ${a.phone||''}</p>
      </div>

      <div class="mt-3" id="cancel-zone"></div>
    `;

    document.getElementById('copy-tracking')?.addEventListener('click', () => {
      navigator.clipboard?.writeText(order.trackingId || '');
      toast('Tracking ID copied');
    });

    const cancelZone = document.getElementById('cancel-zone');
    if (!cancelled && canCancel(order)) {
      cancelZone.innerHTML = `<button class="btn btn-danger btn-block" id="cancel-btn">Cancel Order</button>`;
      document.getElementById('cancel-btn').addEventListener('click', async () => {
        if (!confirm('Cancel this order? This cannot be undone.')) return;
        const res = await requestCancellation(order.id);
        if (res.ok) { toast('Order cancelled'); load(); }
        else toast(res.reason);
      });
    }
  }

  load();
</script>

</body>
</html>
