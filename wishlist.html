<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wishlist — ORÈVA</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="section-tight">
    <div class="container">
      <span class="eyebrow">Saved For Later</span>
      <h1 class="h-display h2">Wishlist</h1>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <div id="wl-empty" class="empty-state" hidden>
        <p class="h4">Your wishlist is empty</p>
        <p class="small mt-1">Tap the heart on any piece to save it here.</p>
        <a href="shop.html" class="btn btn-primary mt-3">Shop Now</a>
      </div>
      <div class="product-grid" id="wl-grid"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module">
  import { renderHeader, renderFooter, applyBackground, formatINR, toast } from './js/ui.js';
  import { getWishlist, toggleWishlist } from './js/cart.js';
  import './js/auth.js';

  renderHeader('');
  renderFooter();
  applyBackground();

  function render(){
    const list = getWishlist();
    document.getElementById('wl-empty').hidden = list.length > 0;
    document.getElementById('wl-grid').innerHTML = list.map(p => `
      <article class="product-card">
        <div class="product-media">
          <a href="product.html?id=${p.id}">${p.image ? `<img src="${p.image}" alt="${p.name}">` : `<div class="skeleton" style="width:100%;height:100%"></div>`}</a>
          <button class="wishlist-toggle" data-id="${p.id}" aria-label="Remove from wishlist" style="color:#8C3A2B">
            <svg viewBox="0 0 24 24" fill="currentColor" style="width:17px;height:17px"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.1 2.4 4.5 6 4c2.1-.3 4 .8 6 3 2-2.2 3.9-3.3 6-3 3.6.5 5.6 4.1 4 7.7C19.5 16.4 12 21 12 21z"/></svg>
          </button>
        </div>
        <div class="product-info">
          <a href="product.html?id=${p.id}"><h3 class="product-name">${p.name}</h3></a>
          <div class="product-price"><span class="price-now">${formatINR(p.price)}</span></div>
        </div>
      </article>
    `).join('');
    document.querySelectorAll('.wishlist-toggle').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        toggleWishlist({ id: btn.dataset.id });
        toast('Removed from wishlist');
        render();
      });
    });
  }
  render();
</script>

</body>
</html>
